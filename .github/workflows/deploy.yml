name: Deploy to homeserver

on:
  # A push to main refreshes dev.rlonrails.com; publishing a release moves
  # rlonrails.com to the new tag. Both reach the same fixed command on the
  # homeserver, which re-converges both sites either way.
  push:
    branches: [main]
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger deployment via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOMESERVER_SSH_HOST }}
          username: ${{ secrets.HOMESERVER_SSH_USER }}
          key: ${{ secrets.HOMESERVER_SSH_KEY }}
          port: ${{ secrets.HOMESERVER_SSH_PORT }}
